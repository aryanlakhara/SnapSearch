<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapSearch</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
<header>
  <h1>SnapSearch</h1>
  <p>Find beautiful images for any idea.</p>
  
  <form id="search-form">
  <label for="search-input">Search for an image</label>

  <input
    id="search-input"
    type="search"
    placeholder="Search images..."
  >

  <button id="search-button" type="submit">Search</button>
  </form>
</header>


<main>
    <div class="quick-picks">
  <span>Quick picks:</span>
  <button type="button">Nature</button>
  <button type="button">Animals</button>
  <button type="button">Cities</button>
   </div>
  <p id="status">Search to see results.</p>
  <p id="result-count">Showing 0 results</p>

  <section id="results"></section>

</main>

</body>

<script src="script.js"></script>
</html>
